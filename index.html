<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inas Gedichte-Abenteuer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#7C4DFF;--pl:#B388FF;--pd:#6200EA;--s:#FF6D00;--sl:#FFAB40;--ok:#00C853;--okl:#69F0AE;--err:#FF1744;--warn:#FFD600;--bg:#F5F0FF;--bgc:#fff;--t:#1A1A2E;--tl:#5C5C7A;--r:16px;--r2:12px;--r3:8px;--sh:0 4px 20px rgba(124,77,255,.12);--sh2:0 8px 32px rgba(124,77,255,.18);--font:"Segoe UI",system-ui,sans-serif}
html{scroll-behavior:smooth}body{font-family:var(--font);background:var(--bg);color:var(--t);min-height:100vh;line-height:1.6;overflow-x:hidden;padding-bottom:60px}
h1,h2,h3,h4{line-height:1.3}button{font-family:var(--font);cursor:pointer;border:none;outline:none}input,textarea,select{font-family:var(--font);outline:none}
.hd{background:linear-gradient(135deg,var(--p),#9C27B0,var(--s));color:#fff;padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(124,77,255,.3)}
.hd h1{font-size:1.5em}.hd .sub{opacity:.9;font-size:.85em;margin-top:2px}
.hnav{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.hnav button{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:50px;font-size:.78em;font-weight:600;transition:all .3s}
.hnav button:hover,.hnav button.on{background:#fff;color:var(--p);border-color:#fff}
.ct{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--bgc);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{color:var(--pd);margin-bottom:6px}.card h3{color:var(--p);margin-bottom:4px}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.hc{background:var(--bgc);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer;transition:all .3s;border-left:5px solid var(--p);position:relative}
.hc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.hc .icon{font-size:1.8em;margin-bottom:6px}.hc .tit{font-size:1.05em;font-weight:700;margin-bottom:3px}.hc .desc{font-size:.82em;color:var(--tl);margin-bottom:8px}
.pbar{background:#E8E0F0;border-radius:20px;height:10px;overflow:hidden;margin-bottom:3px}
.pfill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--ok),var(--okl));transition:width .6s}
.hc .pct{font-size:.75em;color:var(--tl);font-weight:600}
.hc:nth-child(2){border-left-color:#E91E63}.hc:nth-child(3){border-left-color:#FF9800}.hc:nth-child(4){border-left-color:#4CAF50}
.hc:nth-child(5){border-left-color:#2196F3}.hc:nth-child(6){border-left-color:#9C27B0}.hc:nth-child(7){border-left-color:#F44336}
.hc:nth-child(8){border-left-color:#009688}.hc:nth-child(9){border-left-color:#FF5722}.hc:nth-child(10){border-left-color:#FFD600}
.hc .bdg{position:absolute;top:8px;right:10px;font-size:1.3em}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:50px;font-size:.95em;font-weight:700;transition:all .3s;margin:4px;text-align:center;justify-content:center}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.btn-p{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:0 4px 12px rgba(124,77,255,.3)}
.btn-ok{background:linear-gradient(135deg,var(--ok),#00E676);color:#fff}
.btn-w{background:linear-gradient(135deg,var(--s),#FF8F00);color:#fff}
.btn-o{background:transparent;border:2px solid var(--p);color:var(--p)}.btn-o:hover{background:var(--p);color:#fff}
.btn-d{background:linear-gradient(135deg,var(--err),#D50000);color:#fff}
.btn-g{background:rgba(124,77,255,.08);color:var(--p)}.btn-g:hover{background:rgba(124,77,255,.15)}
.btn-sm{padding:7px 14px;font-size:.82em}.btn-lg{padding:14px 30px;font-size:1.05em}
.eq{font-size:1.1em;font-weight:600;margin-bottom:14px;line-height:1.5}
.ei{font-size:.88em;color:var(--tl);margin-bottom:10px;font-style:italic}
.poem{background:linear-gradient(135deg,#FFF8E1,#FFF3E0);border-radius:var(--r2);padding:18px 22px;margin:10px 0;font-size:1.02em;line-height:2;border-left:4px solid var(--sl);white-space:pre-line}
.mco{display:flex;flex-direction:column;gap:8px}
.mc{background:var(--bgc);border:2px solid #E0D8F0;border-radius:var(--r2);padding:12px 16px;cursor:pointer;transition:all .3s;font-size:.98em;text-align:left;display:flex;align-items:center;gap:10px;min-height:44px}
.mc:hover{border-color:var(--pl);background:#F8F4FF;transform:translateX(4px)}
.mc.sel{border-color:var(--p);background:#EDE7F6;font-weight:600}
.mc.ok{border-color:var(--ok);background:#E8F5E9}.mc.no{border-color:var(--err);background:#FFEBEE}
.mc .ml{min-width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82em;flex-shrink:0}
.mc.ok .ml{background:var(--ok)}.mc.no .ml{background:var(--err)}
.syl-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.syl{padding:10px 14px;border:2px solid #D0C8E0;border-radius:var(--r3);background:var(--bgc);font-size:1.1em;cursor:pointer;transition:all .2s;min-width:48px;text-align:center;user-select:none}
.syl:hover{border-color:var(--pl);background:#F8F4FF}
.syl.str{border-color:var(--p);background:linear-gradient(135deg,#EDE7F6,#D1C4E9);font-weight:700}
.syl.c-ok{border-color:var(--ok);background:#E8F5E9}.syl.c-no{border-color:var(--err);background:#FFEBEE}
.rr{display:flex;align-items:center;gap:10px;margin:6px 0;padding:6px 10px;background:var(--bgc);border-radius:var(--r3);border:2px solid transparent}
.rr:hover{border-color:#E0D8F0}
.rr .vt{flex:1}.rr .ew{font-weight:700;color:var(--p)}
.rr select{width:48px;height:36px;border:2px solid #D0C8E0;border-radius:var(--r3);font-size:1.05em;font-weight:700;text-align:center;background:var(--bgc);color:var(--p)}
.hw{display:inline-block;padding:2px 5px;margin:1px;border-radius:4px;cursor:pointer;transition:all .2s;border:2px solid transparent}
.hw:hover{background:rgba(124,77,255,.1);border-color:rgba(124,77,255,.2)}
.hw.sel{background:#EDE7F6;border-color:var(--p);font-weight:600}
.hw.ok{background:#E8F5E9;border-color:var(--ok)}.hw.no{background:#FFEBEE;border-color:var(--err)}
.tf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tfb{flex:1;min-width:120px;max-width:200px;padding:12px 18px;border-radius:var(--r2);font-size:1em;font-weight:700;cursor:pointer;transition:all .3s;border:2px solid #E0D8F0;background:var(--bgc)}
.tfb:hover{transform:translateY(-2px)}
.tfb.ok{border-color:var(--ok);background:#E8F5E9}.tfb.no{border-color:var(--err);background:#FFEBEE}
.fi{width:100%;max-width:400px;padding:10px 14px;font-size:1em;border:3px solid #E0D8F0;border-radius:var(--r2);text-align:center;transition:all .3s;background:var(--bgc)}
.fi:focus{border-color:var(--p)}.fi.ok{border-color:var(--ok);background:#E8F5E9}.fi.no{border-color:var(--err);background:#FFEBEE}
.ft{width:100%;min-height:80px;padding:12px;border:3px solid #E0D8F0;border-radius:var(--r2);font-size:.98em;resize:vertical;transition:all .3s;line-height:1.5}
.ft:focus{border-color:var(--p)}
.fb{border-radius:var(--r2);padding:14px 18px;margin:10px 0;font-size:.92em;line-height:1.5;animation:fadeIn .4s}
.fb-ok{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);border-left:4px solid var(--ok);color:#1B5E20}
.fb-no{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);border-left:4px solid var(--err);color:#B71C1C}
.fb-hint{background:linear-gradient(135deg,#FFF8E1,#FFECB3);border-left:4px solid var(--warn);color:#E65100}
.fb-info{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-left:4px solid #2196F3;color:#0D47A1}
.fb-sol{background:linear-gradient(135deg,#F3E5F5,#E1BEE7);border-left:4px solid #9C27B0;color:#4A148C}
.tc{background:linear-gradient(135deg,#F3E5F5,#E8EAF6);border-radius:var(--r);padding:18px;margin:10px 0;border-left:5px solid var(--p)}
.tc h3{color:var(--pd);margin-bottom:6px}
.tc .ex{background:rgba(255,255,255,.6);border-radius:var(--r3);padding:10px;margin:6px 0;font-style:italic}
.tc .merk{background:linear-gradient(135deg,#FFFDE7,#FFF9C4);border-radius:var(--r3);padding:10px;margin:6px 0;border-left:4px solid var(--warn);font-weight:600}
.ltab{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.lt{padding:7px 14px;border:2px solid #E0D8F0;border-radius:50px;background:var(--bgc);font-size:.82em;font-weight:600;cursor:pointer;transition:all .3s}
.lt:hover{border-color:var(--pl)}.lt.on{background:var(--p);color:#fff;border-color:var(--p)}.lt.done{border-color:var(--ok);color:var(--ok)}
.badge-r{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;justify-content:center}
.bdg-i{background:var(--bgc);border:2px solid #E0D8F0;border-radius:var(--r2);padding:8px 14px;text-align:center;min-width:90px}
.bdg-i.earned{border-color:var(--warn);background:linear-gradient(135deg,#FFFDE7,#FFF9C4)}
.bdg-i .bi{font-size:1.8em;margin-bottom:2px}.bdg-i .bn{font-size:.72em;font-weight:700;color:var(--tl)}.bdg-i.earned .bn{color:var(--t)}
.streak{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);padding:5px 12px;border-radius:50px;font-weight:700;font-size:.88em;color:#E65100}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.mi{background:var(--bgc);border:2px solid #E0D8F0;border-radius:var(--r2);padding:10px 14px;cursor:pointer;transition:all .3s;text-align:center;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center}
.mi:hover{border-color:var(--pl)}.mi.sel{border-color:var(--p);background:#EDE7F6}.mi.matched{border-color:var(--ok);background:#E8F5E9;opacity:.7;cursor:default}
.exhd{background:linear-gradient(135deg,#1A237E,#283593);color:#fff;border-radius:var(--r);padding:22px;text-align:center;margin-bottom:14px}
.sc-card{background:var(--bgc);border:2px solid #E0D8F0;border-radius:var(--r);padding:18px;margin:10px 0}
.sc-card h4{margin-bottom:8px;color:var(--p)}
.cklist{list-style:none;padding:0}.cklist li{padding:6px 0;display:flex;align-items:center;gap:8px;font-size:.92em}
.cklist input[type="checkbox"]{width:18px;height:18px;accent-color:var(--p)}
.pt{width:100%;border-collapse:collapse;margin:10px 0}
.pt th,.pt td{padding:8px 10px;text-align:left;border-bottom:1px solid #B0BEC5}.pt th{background:#455A64;color:#fff;font-size:.85em}.pt tr:hover{background:rgba(0,0,0,.04)}
.ss-c{background:var(--bgc);border:2px dashed var(--pl);border-radius:var(--r2);padding:14px;margin:6px 0}
.ss-c .starter{font-weight:600;color:var(--pd);font-size:.98em;line-height:1.6}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@media(max-width:768px){.hd h1{font-size:1.25em}.ct{padding:10px}.card{padding:16px}.hg{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}.poem{padding:12px 14px;font-size:.92em}.syl{padding:8px 10px;min-width:40px}}
@media(max-width:480px){.hd{padding:12px 8px 10px}.hd h1{font-size:1.1em}.hnav button{padding:4px 8px;font-size:.7em}.hc{padding:12px}.tf{flex-direction:column}.tfb{max-width:100%}.ltab{gap:3px}.lt{padding:5px 10px;font-size:.78em}}
@media(min-width:1024px){.ct{max-width:920px}.hg{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<div class="hd"><h1>🌟 Inas Gedichte-Abenteuer 🌟</h1><p class="sub">Fit für den Deutschtest – Schritt für Schritt zur sicheren Gedichtanalyse</p><div class="hnav"><button onclick="nav('home')" id="nb-home">🏠 Start</button><button onclick="nav('bib')" id="nb-bib">📖 Bibliothek</button><button onclick="nav('satz')" id="nb-satz">✍️ Satzstarter</button><button onclick="nav('quick')" id="nb-quick">⚡ Wiederholung</button><button onclick="nav('eltern')" id="nb-eltern">👨‍👩‍👧 Für Eltern</button></div></div>
<div class="ct"><div id="main"></div></div>
<div id="mbg" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2000;justify-content:center;align-items:center;padding:16px" onclick="if(event.target===this)closeModal()"><div id="mbox" style="background:#fff;border-radius:16px;padding:28px;max-width:500px;width:100%;box-shadow:0 8px 32px rgba(124,77,255,.18)"></div></div>
<div id="cft" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3000;overflow:hidden"></div>
<script>
/*JSSTART*/
'use strict';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),M=document.getElementById('main');
const TOPICS=[
{id:'grund',icon:'📚',title:'Grundlagen',desc:'Gedicht, Vers, Strophe, Reim',color:'#7C4DFF'},
{id:'reim',icon:'🎵',title:'Reim & Reimschema',desc:'Paarreim, Kreuzreim, Umarmender Reim',color:'#E91E63'},
{id:'metrum',icon:'👏',title:'Metrum',desc:'Silben, Hebung, Senkung, Versmaß',color:'#FF9800'},
{id:'bilder',icon:'🎨',title:'Sprachliche Bilder',desc:'Überblick: Vergleich, Personifikation, Metapher',color:'#4CAF50'},
{id:'vergleich',icon:'🔍',title:'Vergleich',desc:'wie, als, als ob – zwei Dinge vergleichen',color:'#2196F3'},
{id:'person',icon:'🌳',title:'Personifikation',desc:'Wenn Dinge menschlich handeln',color:'#9C27B0'},
{id:'metapher',icon:'💡',title:'Metapher',desc:'Bildliche Übertragung',color:'#F44336'},
{id:'mixed',icon:'🧩',title:'Alles gemischt',desc:'Vergleich, Personifikation oder Metapher?',color:'#009688'},
{id:'pruef',icon:'🎯',title:'Prüfungstraining',desc:'Gemischte Übungen wie im Test',color:'#FF5722'},
{id:'exam',icon:'🏆',title:'Große Abschlussprüfung',desc:'Teste dein Wissen!',color:'#FFD600'}
];
const LEVELS=['Verstehen','Erkennen','Anwenden','Erklären','Selbst machen','Mini-Test'];
const BADGES=[
{id:'reim-profi',icon:'🎵',name:'Reim-Profi',req:{topic:'reim',pct:80}},
{id:'metrum-det',icon:'🥁',name:'Metrum-Detektivin',req:{topic:'metrum',pct:80}},
{id:'bilder-exp',icon:'🎨',name:'Bilder-Expertin',req:{topic:'mixed',pct:80}},
{id:'gedichte-m',icon:'👑',name:'Gedichte-Meisterin',req:{topic:'exam',pct:80}},
{id:'vergleich-p',icon:'🔍',name:'Vergleich-Profi',req:{topic:'vergleich',pct:80}},
{id:'person-p',icon:'🌳',name:'Personifikation-Profi',req:{topic:'person',pct:80}},
{id:'metapher-p',icon:'💡',name:'Metapher-Profi',req:{topic:'metapher',pct:80}},
{id:'grund-p',icon:'📚',name:'Grundlagen-Profi',req:{topic:'grund',pct:80}}
];
/* PROGRESS */
let P={};
function loadP(){try{P=JSON.parse(localStorage.getItem('iga-progress'))||{}}catch(e){P={}}
if(!P.topics)P.topics={};if(!P.stars)P.stars=0;if(!P.streak)P.streak=0;if(!P.lastDay)P.lastDay='';if(!P.badges)P.badges=[];if(!P.attempts)P.attempts={};if(!P.examResults)P.examResults=[];}
function saveP(){localStorage.setItem('iga-progress',JSON.stringify(P))}
function getTP(tid){if(!P.topics[tid])P.topics[tid]={correct:0,wrong:0,total:0,level:0,hints:0};return P.topics[tid]}
function getPct(tid){let t=getTP(tid);return t.total===0?0:Math.round(t.correct/Math.max(t.total,1)*100)}
function recordAnswer(tid,qid,correct,hintsUsed){
let t=getTP(tid);t.total++;if(correct)t.correct++;else t.wrong++;t.hints+=(hintsUsed||0);
if(!P.attempts[tid])P.attempts[tid]={};P.attempts[tid][qid]={correct,hints:hintsUsed||0,time:Date.now()};
checkStreak();checkBadges();saveP();
}
function checkStreak(){let today=new Date().toISOString().slice(0,10);
if(P.lastDay!==today){let yd=new Date();yd.setDate(yd.getDate()-1);
if(P.lastDay===yd.toISOString().slice(0,10))P.streak++;else P.streak=1;P.lastDay=today;}}
function checkBadges(){BADGES.forEach(b=>{if(!P.badges.includes(b.id)&&getPct(b.req.topic)>=b.req.pct){P.badges.push(b.id);saveP();showBadgeEarned(b);}})}
function showBadgeEarned(b){showModal(`<div style="text-align:center"><div style="font-size:3em;margin-bottom:10px">${b.icon}</div><h3>🎉 Neues Abzeichen!</h3><p style="font-size:1.1em;margin:8px 0;font-weight:700">${b.name}</p><p style="color:var(--tl)">Toll gemacht, Ina!</p><button class="btn btn-p" onclick="closeModal()" style="margin-top:12px">Super! 🌟</button></div>`);fireConfetti();}
/* MODAL */
function showModal(html){let bg=$('#mbg');bg.style.display='flex';$('#mbox').innerHTML=html}
function closeModal(){$('#mbg').style.display='none'}
/* CONFETTI */
function fireConfetti(){let c=$('#cft');c.innerHTML='';let cols=['#7C4DFF','#FF6D00','#00C853','#FF1744','#FFD600','#E91E63','#2196F3'];
for(let i=0;i<40;i++){let d=document.createElement('div');d.style.cssText=`position:absolute;width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;background:${cols[i%cols.length]};left:${Math.random()*100}%;top:-10px;border-radius:${Math.random()>.5?'50%':'2px'};animation:confettiFall ${2+Math.random()*2}s ease-out forwards;animation-delay:${Math.random()*.5}s`;c.appendChild(d)}
setTimeout(()=>c.innerHTML='',4000)}
/* SPEECH */
function speak(text){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=0.85;speechSynthesis.speak(u)}}
/*NAV*/
let curSection='home';
function nav(id){curSection=id;$$('.hnav button').forEach(b=>b.classList.remove('on'));
let nb=$(`#nb-${id}`);if(nb)nb.classList.add('on');
window.scrollTo({top:0,behavior:'smooth'});
if(id==='home')renderHome();else if(id==='bib')renderBib();else if(id==='satz')renderSatz();
else if(id==='quick')renderQuick();else if(id==='eltern')renderEltern();}
function openTopic(tid,level){renderTopic(tid,level||0)}
/*HOME*/
function renderHome(){
let h='<div class="card" style="text-align:center"><h2>Willkommen, Ina! 👋</h2><p>Hier lernst du alles über Gedichte – Schritt für Schritt. Wähle ein Thema und leg los!</p>';
h+=`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px"><div class="streak">🔥 ${P.streak||0} Tage am Stück</div><div class="streak" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9);color:#1B5E20">⭐ ${P.stars||0} Wissensterne</div></div></div>`;
h+='<div class="badge-r">';BADGES.forEach(b=>{let e=P.badges&&P.badges.includes(b.id);h+=`<div class="bdg-i${e?' earned':''}"><div class="bi">${e?b.icon:'🔒'}</div><div class="bn">${b.name}</div></div>`});h+='</div>';
h+='<div class="hg">';TOPICS.forEach((t,i)=>{let pct=getPct(t.id);let st=pct>=80?'🟢':pct>=40?'🟡':'';
h+=`<div class="hc" onclick="${t.id==='exam'?'startExam()':'openTopic(\''+t.id+'\')'}"><div class="icon">${t.icon}</div><div class="tit">${t.title}</div><div class="desc">${t.desc}</div><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><div class="pct">${pct}% ${st}</div>${P.badges&&P.badges.some(b=>BADGES.find(x=>x.id===b)?.req.topic===t.id)?'<div class="bdg">🏅</div>':''}</div>`});
h+='</div>';
h+=`<div class="card" style="margin-top:14px;text-align:center"><button class="btn btn-d btn-sm" onclick="resetProgress()">🗑️ Fortschritt zurücksetzen</button></div>`;
M.innerHTML=h}

/*RENDER_TOPIC*/

h+=`<button class="lt ${cls}" onclick="renderTopic('${tid}',${i})">${l}</button>`});h+='</div>';

h+=`<button class="btn btn-p" onclick="checkAnswer()">Überprüfen ✓</button>`;

function renderQBody(q){
let h='';

case 'mc':h+='<div class="mco">';q.options.forEach((o,i)=>{h+=`<button class="mc" onclick="selectMC(this,${i})" data-idx="${i}"><span class="ml">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`});h+='</div>';break;
case 'tf':h+=`<div class="tf"><button class="tfb" onclick="selectTF(true)">✅ Stimmt</button><button class="tfb" onclick="selectTF(false)">❌ Stimmt nicht</button></div>`;break;

case 'free':h+=`<textarea class="ft" id="freeInput" placeholder="Schreibe deine Antwort hier..."></textarea>`;break;
case 'highlight':{ let words=q.text.split(/\s+/);h='<div style="line-height:2.2;font-size:1.05em">';words.forEach((w,i)=>{h+=`<span class="hw" onclick="toggleHW(this)" data-w="${w.replace(/[^a-zäöüßA-ZÄÖÜ]/g,'').toLowerCase()}">${w}</span> `});h+='</div>';break; }
case 'syllable':h='<div class="syl-row" id="sylRow">';q.syllables.forEach((s,i)=>{h+=`<button class="syl" onclick="toggleSyl(this,${i})" data-idx="${i}">${s}</button>`});h+='</div><div class="rhy-display" id="rhyDisp"></div>';break;
case 'rhyme-assign':h='<div id="rhyAssign">';q.verses.forEach((v,i)=>{let lastW=v.trim().split(/\s+/).pop();h+=`<div class="rr"><span class="vt">${v} <span class="ew">${lastW}</span></span><select id="rl${i}"><option value="">?</option><option value="a">a</option><option value="b">b</option><option value="c">c</option><option value="d">d</option></select></div>`});h+='</div>';break;
case 'match':{ let items=[...q.left.map((l,i)=>({text:l,side:'l',idx:i})),...q.right.map((r,i)=>({text:r,side:'r',idx:i}))];items=shuffle(items);h='<div class="mgrid" id="matchGrid">';items.forEach((it,i)=>{h+=`<div class="mi" onclick="selectMatch(this)" data-side="${it.side}" data-idx="${it.idx}">${it.text}</div>`});h+='</div>';break; }
case 'order':{ let shuffled=shuffle([...q.items]);h='<div class="oi" id="orderList">';shuffled.forEach((it,i)=>{h+=`<div class="oit" draggable="true" data-val="${it}" ondragstart="dragStart(event)" ondragover="event.preventDefault()" ondrop="dropItem(event)"><span class="on">${i+1}</span><span>${it}</span></div>`});h+='</div>';break; }

function selectMC(el,idx){$$('.mc').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');mcSel=idx;checkAnswer()}

else{if(matchSel===el){el.classList.remove('sel');matchSel=null;return}

let li=s1==='l'?i1:i2,ri=s1==='r'?i1:i2;

if(dIdx<tIdx)target.after(dragEl);else target.before(dragEl);

/*CHECK_ANSWER*/
function checkAnswer(){
let q=curQ;if(!q)return;let correct=false;let userAns='';
switch(q.type){
case 'mc':if(mcSel<0)return;correct=(mcSel===q.answer);
$$('.mc').forEach((b,i)=>{b.style.pointerEvents='none';if(i===q.answer)b.classList.add('ok');if(i===mcSel&&!correct)b.classList.add('no')});break;
case 'tf':if(tfSel===null)return;correct=(tfSel===q.answer);
$$('.tfb').forEach(b=>b.style.pointerEvents='none');
$$('.tfb').forEach((b,i)=>{if((i===0&&q.answer)||(i===1&&!q.answer))b.classList.add('ok');if((i===0&&tfSel&&!correct)||(i===1&&!tfSel&&!correct))b.classList.add('no')});break;
case 'fill':{ let inp=$('#fillInput');if(!inp||!inp.value.trim())return;userAns=inp.value.trim().toLowerCase();
let accepts=Array.isArray(q.answer)?q.answer:[q.answer];correct=accepts.some(a=>userAns===a.toLowerCase()||userAns.replace(/[.,!?;:]/g,'')===a.toLowerCase().replace(/[.,!?;:]/g,''));
inp.classList.add(correct?'ok':'no');if(correct)inp.readOnly=true;break; }
case 'free':{ let ta=$('#freeInput');if(!ta||!ta.value.trim())return;userAns=ta.value.trim();
if(q.keywords){let lw=userAns.toLowerCase();let found=q.keywords.filter(k=>lw.includes(k.toLowerCase()));correct=found.length>=(q.minKeywords||1)}else{correct=true}break; }
case 'highlight':{ let selW=[];$$('.hw.sel').forEach(w=>selW.push(w.dataset.w));let expW=q.answer.map(w=>w.toLowerCase());
correct=expW.length===selW.length&&expW.every(w=>selW.includes(w));
$$('.hw').forEach(w=>{let wl=w.dataset.w;if(expW.includes(wl))w.classList.add('ok');else if(w.classList.contains('sel'))w.classList.add('no')});break; }
case 'syllable':{ let stressed=[];$$('.syl').forEach((s,i)=>{if(s.classList.contains('str'))stressed.push(i)});
correct=q.answer.length===stressed.length&&q.answer.every(a=>stressed.includes(a));
$$('.syl').forEach((s,i)=>{s.style.pointerEvents='none';if(q.answer.includes(i))s.classList.add('c-ok');else if(stressed.includes(i))s.classList.add('c-no')});break; }
case 'rhyme-assign':{ let letters=[];q.verses.forEach((v,i)=>{let sel=$(`#rl${i}`);letters.push(sel?sel.value:'')});correct=letters.join('')===q.answer;break; }
case 'order':{ let items=[...$('#orderList').children].map(c=>c.dataset.val);correct=items.every((v,i)=>v===q.items[i]);break; }
case 'match':return;default:correct=false}
curAttempts++;
if(q.type==='free'&&q.selfCheck){showSelfCheck(q);return}
if(correct){P.stars=(P.stars||0)+1;recordAnswer(curTopic,q.id||curQIdx,true,curHints);showFB(true,q.explanation||'Richtig! 🎉');if(Math.random()>.6)fireConfetti()}
else if(curAttempts>=3){recordAnswer(curTopic,q.id||curQIdx,false,curHints);showFB(false,'📝 '+(q.solution||q.explanation||''),true)}
else{curHints++;showHint()}}

const QBank={};

/*RENDER_ELTERN*/
function renderEltern(){
let h='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="btn btn-g btn-sm" onclick="nav(\'home\')">← Zurück</button><h2>👨‍👩‍👧 Eltern-Übersicht</h2></div>';
h+='<div class="card"><p>Diese Seite zeigt den Lernfortschritt auf einen Blick.</p></div>';
h+='<div class="card"><h3>📊 Fortschritt nach Themen</h3><table class="pt"><tr><th>Thema</th><th>Richtig</th><th>Gesamt</th><th>%</th><th>Status</th></tr>';
TOPICS.forEach(t=>{let tp=getTP(t.id);let pct=getPct(t.id);
let st=pct>=80?'🟢':pct>=40?'🟡':tp.total>0?'🔴':'⚪';
h+=`<tr><td>${t.icon} ${t.title}</td><td>${tp.correct}</td><td>${tp.total}</td><td>${pct}%</td><td>${st}</td></tr>`});
h+='</table></div>';
h+=`<div class="card"><h3>📈 Zusammenfassung</h3><p>🔥 Streak: ${P.streak||0} Tage | ⭐ Sterne: ${P.stars||0} | 🏅 Abzeichen: ${(P.badges||[]).length}/${BADGES.length}</p></div>`;
h+='<div class="card"><h3>🏅 Abzeichen</h3><div class="badge-r">';
BADGES.forEach(b=>{let e=(P.badges||[]).includes(b.id);
h+=`<div class="bdg-i${e?' earned':''}"><div class="bi">${e?b.icon:'🔒'}</div><div class="bn">${b.name}</div></div>`});
h+='</div></div>';
h+=`<div class="card" style="text-align:center"><button class="btn btn-d btn-sm" onclick="resetProgress()">🗑️ Fortschritt zurücksetzen</button></div>`;
M.innerHTML=h}
/*INIT*/
loadP();nav('home');
</script></body></html>
